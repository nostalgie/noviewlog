[package]
name = "noviewlog-slint"
version = "0.1.0"
edition = "2021"
description = "NoViewLog Slint desktop UI (viewport + PTY shell)"
license = "MIT"
repository = "https://github.com/nostalgie/noviewlog"

[lib]
name = "noviewlog_slint"
path = "src/lib.rs"

[[bin]]
name = "noviewlog-slint"
path = "src/main.rs"

[dependencies]
noviewlog-core = { path = "../noviewlog-core" }
arboard = "3"
# Native file picker for File → Open log file… (AsyncFileDialog runs the
# dialog on rfd's own thread so the Slint event loop keeps ticking)
rfd = "0.15"
# unstable-winit-030: Occluded / minimize events (Wayland often leaves Window::is_minimized stuck).
slint = { version = "~1.17", features = ["unstable-winit-030"] }

[lints]
workspace = true

[build-dependencies]
slint-build = "1.17"

# Windows-only: embed app.ico as a PE resource (exe/taskbar/caption icon).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
