[workspace]
members = ["crates/noviewlog-core", "crates/noviewlog-slint", "crates/noviewlog-terminal", "crates/noviewlog-tui"]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Daily GUI loop (`scripts/run-slint.sh`). Same opt-level as release so PTY
# flood stays usable; no fat LTO so incremental rustc works. Debug
# (opt-level 0) pegs a core on Follow+WRAP `cat`. Publish stays `--release`.
[profile.release-dev]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

# Baseline enforced by the code guidelines ("Definition of Done"):
# `cargo clippy --workspace --all-targets` must print zero warnings.
# The allowlist marks deliberate patterns in rendering/layout hot paths —
# do not weaken it to make new code pass; extend it only with a comment why.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Viewport/layout functions pass explicit geometry; arg count is intentional.
too_many_arguments = "allow"
# Constant-stride pixel loops read clearer as written.
chunks_exact_to_as_chunks = "allow"
cloned_ref_to_slice_refs = "allow"
# Explicit f32/u32 casts document rounding/intent in paint math.
unnecessary_cast = "allow"
# Engine/UI structs are constructed in one place each.
new_without_default = "allow"
